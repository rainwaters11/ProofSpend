name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      CIRCLE_CHAIN: ARC-TESTNET
      PROOFSPEND_ADAPTER_MODE: mock

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.18.2

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.14

      - name: Install dependencies
        run: bun install

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: bun-lock-${{ github.sha }}
          path: bun.lock
          if-no-files-found: error
          retention-days: 1

      - name: Commit generated lockfile to PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- bun.lock)" ]; then
            echo "bun.lock is already committed and unchanged."
            exit 0
          fi

          git fetch origin "$HEAD_REF"
          git switch --force-create "$HEAD_REF" "origin/$HEAD_REF"
          git add bun.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add Bun lockfile"
          git push origin "HEAD:$HEAD_REF"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
